spring:

  datasource:
    url: jdbc:postgresql://localhost:5432/eventdb
    username: postgres
    password: postgres

  jpa:
    hibernate:
      ddl-auto: update

  kafka:
    bootstrap-servers: localhost:9092

  data:
    redis:
      host: localhost
      port: 6379

  management:
    endpoint:
      health:
        show-details: always